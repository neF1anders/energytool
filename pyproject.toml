[project]
name = "energytool"
version = "0.1.0"
description = "Energytool AI qualifier: RAG consultant and lead brief"
readme = "README.md"
authors = [
    { name = "ne-F1anders", email = "sosnovgreg@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "bm25s==0.3.16",
    "httpx==0.28.1",
    "numpy==2.2.6",
]

[project.scripts]
energytool = "energytool.interface.cli:main"

[project.optional-dependencies]
web = [
    "fastapi==0.143.2",
    "pydantic==2.14.2",
    "sqlalchemy==2.0.44",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["materials", "eval/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "TID", "RUF100"]

[tool.ruff.lint.flake8-tidy-imports]
# плоская сборка ZIP переписывает только абсолютные импорты (spec §13)
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["energytool"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "eval", "tools"]
exclude = ["^materials/", "^eval/data/"]

[[tool.mypy.overrides]]
module = ["tests.*", "eval.*", "tools.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["bm25s.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: тесты с реальными моделями через OpenRouter (нужен .env)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]
